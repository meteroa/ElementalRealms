<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 185" width="640" height="185">
  <defs>
    <!-- Gold Gradient for Main Title -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#fff2b3" />
      <stop offset="38%" stop-color="#ffd700" />
      <stop offset="68%" stop-color="#d99b26" />
      <stop offset="88%" stop-color="#99580e" />
      <stop offset="100%" stop-color="#552c04" />
    </linearGradient>

    <!-- Bronze Filigree Gradient -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885" />
      <stop offset="45%" stop-color="#c69b3f" />
      <stop offset="100%" stop-color="#4a300e" />
    </linearGradient>

    <!-- Subtitle Gold Gradient -->
    <linearGradient id="subGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c69b3f" stop-opacity="0" />
      <stop offset="20%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#fff8db" />
      <stop offset="80%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#c69b3f" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="goldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="2.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Drop Shadow -->
    <filter id="shadowFilter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <!-- Gem Radial Gradients -->
    <radialGradient id="gemFire" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffb399" />
      <stop offset="45%" stop-color="#f03e13" />
      <stop offset="100%" stop-color="#5e0b00" />
    </radialGradient>
    <radialGradient id="gemWater" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ccf2ff" />
      <stop offset="45%" stop-color="#00aaff" />
      <stop offset="100%" stop-color="#003366" />
    </radialGradient>
    <radialGradient id="gemAir" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffff0" />
      <stop offset="45%" stop-color="#ffea75" />
      <stop offset="100%" stop-color="#997700" />
    </radialGradient>
    <radialGradient id="gemEarth" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d6f5d6" />
      <stop offset="45%" stop-color="#38c938" />
      <stop offset="100%" stop-color="#0d470d" />
    </radialGradient>
    <radialGradient id="gemSpecial" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fad9ff" />
      <stop offset="45%" stop-color="#cf5ffc" />
      <stop offset="100%" stop-color="#4d0b54" />
    </radialGradient>
  </defs>

  <!-- Left: 5-Elements Magic Seal Emblem -->
  <g transform="translate(76, 92)" filter="url(#goldGlow)">
    <!-- Aura Ring -->
    <circle r="56" fill="rgba(255, 215, 0, 0.12)" filter="url(#goldGlow)" />
    <!-- Outer Runic Ring -->
    <circle r="52" fill="none" stroke="url(#bronzeGrad)" stroke-width="3" stroke-dasharray="10 4 5 4" opacity="0.95" />
    <circle r="46" fill="#140d09" stroke="url(#goldGrad)" stroke-width="2.2" />
    <!-- Inner 5-point Star -->
    <polygon points="0,-40 23,-8 37,28 0,16 -37,28 -23,-8" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.9" />
    <!-- Center Core Gem -->
    <circle r="14" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <circle r="9" fill="#ffffff" opacity="0.9" />

    <!-- 5 Elemental Orbiting Gems -->
    <!-- Fire (Top) -->
    <circle cx="0" cy="-40" r="8" fill="url(#gemFire)" stroke="#ffd700" stroke-width="1.8" filter="url(#goldGlow)" />
    <!-- Water (Top-Right) -->
    <circle cx="38" cy="-12" r="8" fill="url(#gemWater)" stroke="#ffd700" stroke-width="1.8" filter="url(#goldGlow)" />
    <!-- Air (Bottom-Right) -->
    <circle cx="23" cy="32" r="8" fill="url(#gemAir)" stroke="#ffd700" stroke-width="1.8" filter="url(#goldGlow)" />
    <!-- Earth (Bottom-Left) -->
    <circle cx="-23" cy="32" r="8" fill="url(#gemEarth)" stroke="#ffd700" stroke-width="1.8" filter="url(#goldGlow)" />
    <!-- Special / Arcane (Top-Left) -->
    <circle cx="-38" cy="-12" r="8" fill="url(#gemSpecial)" stroke="#ffd700" stroke-width="1.8" filter="url(#goldGlow)" />
  </g>

  <!-- Right: Typography Branding -->
  <g transform="translate(160, 0)" filter="url(#shadowFilter)">
    <!-- Backing Radiant Glow for Title -->
    <ellipse cx="230" cy="100" rx="200" ry="42" fill="#ffd700" opacity="0.22" filter="url(#goldGlow)" />

    <!-- English Arch-Title Header -->
    <text x="230" y="44" text-anchor="middle"
          font-family="'Cinzel Decorative', 'Cinzel', 'Trajan Pro', Georgia, serif"
          font-size="16" font-weight="900" letter-spacing="8"
          fill="#ffebb4" stroke="#451a03" stroke-width="1.2" style="paint-order: stroke fill;" filter="url(#goldGlow)">
      ELEMENTAL REALMS · SPECTROMANCER
    </text>

    <!-- Decorative Upper Divider Wings -->
    <line x1="20" y1="53" x2="135" y2="53" stroke="url(#subGold)" stroke-width="2" />
    <polygon points="145,53 152,49 159,53 152,57" fill="#ffd700" />
    <line x1="170" y1="53" x2="290" y2="53" stroke="url(#subGold)" stroke-width="2" />
    <polygon points="300,53 307,49 314,53 307,57" fill="#ffd700" />
    <line x1="325" y1="53" x2="440" y2="53" stroke="url(#subGold)" stroke-width="2" />

    <!-- Main Chinese Title: 元素秘境 (Beautiful Calligraphic Serif & High-Contrast Gold) -->
    <text x="230" y="118" text-anchor="middle"
          font-family="'Ma Shan Zheng', 'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif"
          font-size="62" font-weight="900" letter-spacing="10"
          fill="url(#goldGrad)"
          stroke="#1b0a02" stroke-width="6"
          style="paint-order: stroke fill;"
          filter="url(#goldGlow)">
      元素秘境
    </text>

    <!-- Subtitle Pill: ✦ 魔 导 对 决 ✦ (Significantly Enlarged & Radiant) -->
    <g transform="translate(230, 152)">
      <!-- Left & Right Filigree Rays -->
      <line x1="-210" y1="0" x2="-115" y2="0" stroke="url(#subGold)" stroke-width="2" />
      <polygon points="-110,0 -103,-4 -96,0 -103,4" fill="#ffd700" />

      <!-- Golden Capsule Badge -->
      <rect x="-90" y="-15" width="180" height="30" rx="15" fill="rgba(26, 12, 5, 0.92)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#goldGlow)" />
      
      <!-- Subtitle Text: 20px Bold & Sharp -->
      <text x="0" y="7" text-anchor="middle"
            font-family="'Cinzel Decorative', 'Noto Serif SC', sans-serif"
            font-size="20" font-weight="900" letter-spacing="4"
            fill="#ffd700" stroke="#331404" stroke-width="1.2" style="paint-order: stroke fill;">
        ✦ 魔 导 对 决 ✦
      </text>

      <polygon points="96,0 103,-4 110,0 103,4" fill="#ffd700" />
      <line x1="115" y1="0" x2="210" y2="0" stroke="url(#subGold)" stroke-width="2" />
    </g>
  </g>
</svg>
